name: Build Iris for Paper

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-paper.yml'

permissions:
  contents: read

concurrency:
  group: iris-paper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile and verify Paper plugin
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout TFLIris
        uses: actions/checkout@v4

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and verify Bukkit/Paper JAR
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew buildBukkit --no-daemon --no-parallel --max-workers=2 \
            -PuseLocalVolmLib=false \
            -PpluginOutDirectory=build/ci-output \
            --stacktrace

      - name: Verify output and record SHA-256
        shell: bash
        run: |
          shopt -s nullglob
          jars=(build/ci-output/*.jar)
          if (( ${#jars[@]} == 0 )); then
            echo "::error::No Paper plugin JAR was produced."
            exit 1
          fi
          sha256sum "${jars[@]}" | tee build/ci-output/SHA256SUMS.txt
          {
            echo "## TFLIris Paper build"
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "Download the **TFLIris-Paper** artifact below to obtain the verified plugin JAR."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload compiled Paper plugin
        uses: actions/upload-artifact@v4
        with:
          name: TFLIris-Paper
          path: |
            build/ci-output/*.jar
            build/ci-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
